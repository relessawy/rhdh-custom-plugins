dynamicPlugins:
  frontend:
    rhdh-custom-plugins.plugin-snyk-security:
      entityTabs:
        - path: /security
          title: Security
          mountPoint: entity.page.security
      mountPoints:
        - mountPoint: entity.page.security/cards
          importName: SnykSecurity
          config:
            layout: {gridColumn: '1 / -1'}
            if: {allOf: [isSnykSecurityAvailable]}
