dynamicPlugins:
  frontend:
    rhdh-custom-plugins.plugin-splunk-logs:
      entityTabs:
        - path: /splunk
          title: Splunk
          mountPoint: entity.page.splunk
      mountPoints:
        - mountPoint: entity.page.splunk/cards
          importName: SplunkEntityContent
          config:
            layout: {gridColumn: '1 / -1'}
            if: {allOf: [isSplunkAvailable]}
