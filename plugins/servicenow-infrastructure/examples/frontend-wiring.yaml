dynamicPlugins:
  frontend:
    rhdh-custom-plugins.plugin-servicenow-infrastructure:
      entityTabs:
        - path: /infrastructure
          title: Infrastructure
          mountPoint: entity.page.infrastructure
      mountPoints:
        - mountPoint: entity.page.infrastructure/cards
          importName: ServiceNowInfrastructure
          config:
            layout: {gridColumn: '1 / -1'}
            if: {allOf: [isServiceNowAvailable]}
