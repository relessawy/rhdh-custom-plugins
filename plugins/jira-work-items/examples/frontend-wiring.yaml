dynamicPlugins:
  frontend:
    rhdh-custom-plugins.plugin-jira-work-items:
      entityTabs:
        - path: /jira
          title: Jira
          mountPoint: entity.page.jira
      mountPoints:
        - mountPoint: entity.page.jira/cards
          importName: JiraIssues
          config:
            layout: {gridColumn: '1 / -1'}
            if: {allOf: [isJiraAvailable]}
