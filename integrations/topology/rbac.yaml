apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: rhdh-topology-reader, namespace: example-app}
rules:
  - apiGroups: ['']
    resources: [pods, services, configmaps, persistentvolumeclaims, events, limitranges, resourcequotas]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: rhdh-topology-reader, namespace: example-app}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rhdh-topology-reader}
subjects:
  - {kind: ServiceAccount, name: YOUR_RHDH_SERVICE_ACCOUNT, namespace: YOUR_RHDH_NAMESPACE}
