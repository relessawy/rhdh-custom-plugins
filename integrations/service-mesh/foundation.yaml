apiVersion: v1
kind: Namespace
metadata:
  name: mesh-system
  labels:
    istio-discovery: mesh
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-cni
  labels: {}
---
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
  labels: {}
spec:
  namespace: istio-cni
  version: v1.30.4
  values:
    cni:
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
---
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: mesh
  labels: {}
spec:
  namespace: mesh-system
  version: v1.30.4
  values:
    pilot:
      autoscaleEnabled: false
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    global:
      proxy:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
    meshConfig:
      discoverySelectors:
      - matchLabels:
          istio-discovery: mesh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-metrics
  labels: {}
  namespace: mesh-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-metrics
  labels: {}
  namespace: mesh-system
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-metrics
  labels: {}
  namespace: mesh-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-metrics
subjects:
- kind: ServiceAccount
  name: mesh-metrics
  namespace: mesh-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-metrics
  labels: {}
  namespace: example-app
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-metrics
  labels: {}
  namespace: example-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mesh-metrics
subjects:
- kind: ServiceAccount
  name: mesh-metrics
  namespace: mesh-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-metrics
  labels: {}
  namespace: mesh-system
data:
  prometheus.yml: '{"global": {"scrape_interval": "15s"}, "scrape_configs": [{"job_name":
    "envoy-stats", "kubernetes_sd_configs": [{"role": "pod", "namespaces": {"names":
    ["mesh-system", "example-app"]}}], "relabel_configs": [{"source_labels": ["__meta_kubernetes_pod_container_name"],
    "action": "keep", "regex": "istio-proxy"}, {"source_labels": ["__meta_kubernetes_pod_container_port_name"],
    "action": "keep", "regex": "http-envoy-prom"}, {"source_labels": ["__meta_kubernetes_namespace"],
    "target_label": "namespace"}, {"source_labels": ["__meta_kubernetes_pod_name"],
    "target_label": "pod"}], "metrics_path": "/stats/prometheus"}]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-metrics
  labels: {}
  namespace: mesh-system
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: mesh-metrics
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: mesh-metrics
      containers:
      - name: prometheus
        image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:6d56d6617c25c7dfeb2bd8f218d29760ccbe7f7506caede66719d7ba8a46a65d
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=6h
        - --storage.tsdb.retention.size=512MB
        ports:
        - containerPort: 9090
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
      volumes:
      - name: config
        configMap:
          name: mesh-metrics
      - name: data
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-metrics
  labels: {}
  namespace: mesh-system
spec:
  selector:
    app: mesh-metrics
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  labels: {}
  namespace: mesh-system
spec:
  auth:
    strategy: token
  deployment:
    cluster_wide_access: false
    view_only_mode: true
    discovery_selectors:
      default:
      - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - mesh-system
          - example-app
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  external_services:
    prometheus:
      url: http://mesh-metrics.mesh-system.svc:9090
    grafana:
      enabled: false
    tracing:
      enabled: false
  istio_namespace: mesh-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali-compat
  labels: {}
  namespace: mesh-system
data:
  server.py: "\"\"\"Bridge the native plugin's revision-less TLS query to the named\
    \ control plane.\n\nNo credentials are stored or logged. Upstream API responses\
    \ remain authoritative.\n\"\"\"\nimport http.server\nimport os\nimport ssl\nimport\
    \ urllib.error\nimport urllib.parse\nimport urllib.request\n\nUPSTREAM = os.environ['KIALI_UPSTREAM'].rstrip('/')\n\
    REVISION = os.environ.get('ISTIO_REVISION', 'mesh')\nCA = '/etc/kiali-ca/service-ca.crt'\n\
    \ndef rewrite(path):\n    parts = urllib.parse.urlsplit(path)\n    if parts.scheme\
    \ or parts.netloc or not parts.path.startswith('/api/'):\n        raise ValueError('Only\
    \ relative Kiali API paths are supported')\n    query = urllib.parse.parse_qsl(parts.query,\
    \ keep_blank_values=True)\n    if parts.path == '/api/mesh/tls' and not any(k\
    \ == 'revision' for k, _ in query):\n        query.append(('revision', REVISION))\n\
    \    return parts.path + ('?' + urllib.parse.urlencode(query) if query else '')\n\
    \nclass Handler(http.server.BaseHTTPRequestHandler):\n    def log_message(self,\
    \ *args):\n        pass\n\n    def do_GET(self):\n        if self.path == '/healthz':\n\
    \            self.send_response(200); self.end_headers(); self.wfile.write(b'ok');\
    \ return\n        self.forward()\n\n    def do_POST(self):\n        # Authentication\
    \ is the only write endpoint needed by the native reader.\n        if urllib.parse.urlsplit(self.path).path\
    \ != '/api/authenticate':\n            self.send_error(405); return\n        self.forward()\n\
    \n    def forward(self):\n        try:\n            path = rewrite(self.path)\n\
    \            size = int(self.headers.get('Content-Length', '0'))\n           \
    \ if size > 32768: raise ValueError('Body too large')\n            headers = {k:v\
    \ for k,v in self.headers.items() if k.lower() in\n                       {'accept','content-type','cookie','authorization','x-auth-type-kiali-ui'}}\n\
    \            req = urllib.request.Request(UPSTREAM + path, data=self.rfile.read(size)\
    \ if self.command=='POST' else None,\n                                       \
    \  headers=headers, method=self.command)\n            try:\n                response\
    \ = urllib.request.urlopen(req, context=ssl.create_default_context(cafile=CA),\
    \ timeout=20)\n            except urllib.error.HTTPError as error:\n         \
    \       response = error\n            body=response.read()\n            self.send_response(response.status)\n\
    \            for key,value in response.headers.items():\n                if key.lower()\
    \ in {'content-type','set-cookie'}: self.send_header(key,value)\n            self.send_header('Content-Length',str(len(body)));\
    \ self.end_headers();self.wfile.write(body)\n        except ValueError:\n    \
    \        self.send_error(400, 'Invalid request')\n        except Exception:\n\
    \            self.send_response(502); self.send_header('Content-Type','application/json');self.end_headers()\n\
    \            self.wfile.write(b'{\"error\":\"Kiali upstream unavailable\"}')\n\
    \nif __name__ == '__main__':\n    http.server.ThreadingHTTPServer(('0.0.0.0',8080),Handler).serve_forever()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali-compat-ca
  labels: {}
  namespace: mesh-system
  annotations:
    service.beta.openshift.io/inject-cabundle: 'true'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiali-compat
  labels: {}
  namespace: mesh-system
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: kiali-compat
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: adapter
        image: registry.access.redhat.com/ubi9/python-312@sha256:a9f1c5dd1cd239c987058b0743c53af0378df48a12b6004bf4496847051062bf
        command:
        - python3
        - /app/server.py
        env:
        - name: KIALI_UPSTREAM
          value: https://kiali.mesh-system.svc:20001
        - name: ISTIO_REVISION
          value: mesh
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: source
          mountPath: /app
          readOnly: true
        - name: ca
          mountPath: /etc/kiali-ca
          readOnly: true
      volumes:
      - name: source
        configMap:
          name: kiali-compat
      - name: ca
        configMap:
          name: kiali-compat-ca
---
apiVersion: v1
kind: Service
metadata:
  name: kiali-compat
  labels: {}
  namespace: mesh-system
spec:
  selector:
    app: kiali-compat
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kiali-compat
  labels: {}
  namespace: mesh-system
spec:
  podSelector:
    matchLabels:
      app: kiali-compat
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rhdh
    ports:
    - port: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mesh-metrics-scrape
  namespace: example-app
spec:
  podSelector:
    matchLabels:
      istio.io/rev: mesh
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: mesh-system
      podSelector:
        matchLabels:
          app: mesh-metrics
    ports:
    - protocol: TCP
      port: 15090
