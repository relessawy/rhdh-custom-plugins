apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali-compat-ca
  labels: {}
  namespace: mesh-system
  annotations:
    service.beta.openshift.io/inject-cabundle: 'true'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiali-compat
  labels: {}
  namespace: mesh-system
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: kiali-compat
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: adapter
        image: registry.access.redhat.com/ubi9/python-312@sha256:a9f1c5dd1cd239c987058b0743c53af0378df48a12b6004bf4496847051062bf
        command:
        - python3
        - /app/server.py
        env:
        - name: KIALI_UPSTREAM
          value: https://kiali.mesh-system.svc:20001
        - name: ISTIO_REVISION
          value: mesh
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: source
          mountPath: /app
          readOnly: true
        - name: ca
          mountPath: /etc/kiali-ca
          readOnly: true
      volumes:
      - name: source
        configMap:
          name: kiali-compat
      - name: ca
        configMap:
          name: kiali-compat-ca
---
apiVersion: v1
kind: Service
metadata:
  name: kiali-compat
  labels: {}
  namespace: mesh-system
spec:
  selector:
    app: kiali-compat
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kiali-compat
  labels: {}
  namespace: mesh-system
spec:
  podSelector:
    matchLabels:
      app: kiali-compat
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rhdh
    ports:
    - port: 8080
      protocol: TCP
