# Install into the same namespace as the existing RHDH instance.
fullnameOverride: ''
branding:
  enabled: true
  title: ACME Bank Developer Hub
  organization: ACME Bank
  primary: '#DA1710'
  header: '#B5120B'
overview:
  enabled: true
  # Enable providers only after their native/custom backend is configured.
  enabledCards: []
  detailTabs: []
