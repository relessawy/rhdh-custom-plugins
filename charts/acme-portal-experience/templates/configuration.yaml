{{- $dynamic := include "acme.dynamic" . | fromYaml -}}
{{- $config := include "acme.config" . | fromYaml -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "acme.name" . }}-configuration
  labels:
    {{- include "acme.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  # Native Helm handoff: merge this file into the EXISTING RHDH release.
  helm-values.yaml: |
    {{- toYaml (dict "global" (dict "dynamic" $dynamic) "upstream" (dict "backstage" (dict "appConfig" $config))) | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "acme.name" . }}-app-config
  labels:
    {{- include "acme.labels" . | nindent 4 }}
data:
  acme-app-config.yaml: |
    {{- toYaml $config | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "acme.name" . }}-dynamic-plugins
  labels:
    {{- include "acme.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  dynamic-plugins.yaml: |
    {{- toYaml $dynamic | nindent 4 }}
