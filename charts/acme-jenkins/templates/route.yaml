{{- if .Values.jenkins.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "acme.jenkins.controller" . }}
spec:
  host: {{ printf "%s.%s" (include "acme.jenkins.controller" .) (required "Set global.domain" .Values.global.domain) | quote }}
  to: {kind: Service, name: {{ include "acme.jenkins.controller" . }}}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
{{- end }}
