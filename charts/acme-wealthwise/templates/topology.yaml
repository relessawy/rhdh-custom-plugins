{{- if .Values.topology.readerServiceAccount }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-topology-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: {{ .Values.topology.readerServiceAccount }}
    namespace: {{ .Values.topology.readerNamespace }}
{{- end }}
