{{- range $module := list "ww-frontend" "financial-advisor" "investment-advisor" "advisor-history" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $module }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.name }}
    backstage.io/kubernetes-id: {{ $.Values.name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ $module }}}
  template:
    metadata:
      labels:
        app: {{ $module }}
        app.kubernetes.io/part-of: {{ $.Values.name }}
        backstage.io/kubernetes-id: {{ $.Values.name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      {{- if $.Values.imagePullSecret }}
      imagePullSecrets: [{name: {{ $.Values.imagePullSecret }}}]
      {{- end }}
      containers:
        - name: app
          image: {{ index $.Values.images $module | quote }}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /q/health/started, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /q/health/ready, port: http}
          livenessProbe:
            httpGet: {path: /q/health/live, port: http}
          env:
            - {name: JAVA_OPTS_APPEND, value: '-XX:MaxRAMPercentage=70.0'}
            {{- if eq $module "ww-frontend" }}
            - name: OIDC_ISSUER
              valueFrom: {secretKeyRef: {name: {{ $.Values.name }}-oidc, key: issuer}}
            - name: OIDC_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ $.Values.name }}-oidc, key: client-id}}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $.Values.name }}-oidc, key: client-secret}}
            {{- end }}
            {{- if eq $module "advisor-history" }}
            - {name: DB_USER, value: wealthwise}
            - {name: DB_URL, value: 'jdbc:postgresql://{{ $.Values.name }}-db.{{ $.Release.Namespace }}.svc:5432/wealthwise?sslmode=verify-full&sslrootcert=/db-ca/ca.crt'}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.name }}-db-app, key: password}}
            {{- end }}
          {{- if eq $module "advisor-history" }}
          volumeMounts: [{name: db-ca, mountPath: /db-ca, readOnly: true}]
      volumes:
        - name: db-ca
          configMap:
            name: {{ $.Values.name }}-db-ca
            items: [{key: service-ca.crt, path: ca.crt}]
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $module }}
  labels: {app.kubernetes.io/part-of: {{ $.Values.name }}}
spec:
  selector: {app: {{ $module }}}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.name }}
spec:
  host: {{ .Values.routeHost | quote }}
  to: {kind: Service, name: ww-frontend}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
