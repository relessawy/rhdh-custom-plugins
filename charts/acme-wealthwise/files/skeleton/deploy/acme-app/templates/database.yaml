apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-db
  labels: {app.kubernetes.io/part-of: {{ .Values.name }}}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ .Values.name }}-db-tls
spec:
  selector: {app: {{ .Values.name }}-db}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-db-config
data:
  postgresql.conf: |
    ssl=on
    ssl_cert_file='/tls/tls.crt'
    ssl_key_file='/tls/tls.key'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}-db
  labels:
    app.kubernetes.io/part-of: {{ .Values.name }}
    backstage.io/kubernetes-id: {{ .Values.name }}
spec:
  serviceName: {{ .Values.name }}-db
  replicas: 1
  selector:
    matchLabels: {app: {{ .Values.name }}-db}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-db
        app.kubernetes.io/part-of: {{ .Values.name }}
        backstage.io/kubernetes-id: {{ .Values.name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.database.image | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRESQL_USER, value: wealthwise}
            - {name: POSTGRESQL_DATABASE, value: wealthwise}
            - name: POSTGRESQL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.name }}-db-app, key: password}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -h /var/run/postgresql -p 5432']}
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -h /var/run/postgresql -p 5432']}
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
            - {name: config, mountPath: /opt/app-root/src/postgresql-cfg/postgresql.conf, subPath: postgresql.conf, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ .Values.name }}-db-config}
        - name: tls
          secret: {secretName: {{ .Values.name }}-db-tls, defaultMode: 416}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.database.storageClass }}
        storageClassName: {{ .Values.database.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.database.size }}}
