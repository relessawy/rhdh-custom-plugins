{{- range $module := list "ww-frontend" "financial-advisor" "investment-advisor" "advisor-history" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $module }}
spec:
  podSelector: {matchLabels: {app: {{ $module }}}}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if eq $module "ww-frontend" }}
        - namespaceSelector: {matchLabels: {network.openshift.io/policy-group: ingress}}
        {{- else }}
        - podSelector: {matchLabels: {app: ww-frontend}}
        {{- if eq $module "advisor-history" }}
        - podSelector: {matchLabels: {app: financial-advisor}}
        - podSelector: {matchLabels: {app: investment-advisor}}
        {{- end }}
        {{- end }}
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-db
spec:
  podSelector: {matchLabels: {app: {{ .Values.name }}-db}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: advisor-history}}
      ports: [{protocol: TCP, port: 5432}]
