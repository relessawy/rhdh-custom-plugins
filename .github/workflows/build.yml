name: Build dynamic plugins
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        plugin: [jenkins-stage-progress, snyk-security, splunk-logs, jira-work-items, application-health, vault-health, servicenow-infrastructure, portal-appearance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/build.sh '${{ matrix.plugin }}'
      - uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.plugin }}-packages'
          path: artifacts/${{ matrix.plugin }}/
  integration-services:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r plugins/servicenow-infrastructure/services/requirements.txt -r plugins/servicenow-infrastructure/services/runtime/requirements.txt
      - run: python -m unittest discover -s plugins/servicenow-infrastructure/services/test
      - run: python -m unittest discover -s plugins/vault-health/collector/test
